[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[project]
name = "yield-allocator"
version = "0.1.0"
description = "Static allocation optimizer for utilization-based lending markets"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
yield-allocate = "yield_allocator.cli:main"
yield-benchmark = "yield_allocator.benchmark:main"

[tool.uv.build-backend]
module-name = "yield_allocator"
module-root = "src"
